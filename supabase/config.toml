# CareSuite+ – lokale Supabase-Konfiguration
# Start: npx supabase start
# Migrationen: npx supabase db push

project_id = "caresuite-plus"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["exp://localhost:8081"]

[auth.email]
enable_signup = true
enable_confirmations = false
[functions.portal-push-dispatch]
verify_jwt = false

# Public challenge creation; approvals validate the authenticated caller in the handler.
# Polling and consumption require the separate 256-bit device secret.
[functions.tv-device-login]
verify_jwt = false

# Public company registration; the handler validates the body and provisions atomically.
[functions.register-business-tenant]
verify_jwt = false

# Only the dedicated Vault scheduler token is accepted by this handler.
[functions.registration-welcome-dispatch]
verify_jwt = false

# Public forms validate every input; recovery completion verifies its one-time
# Auth token and current administration profile inside the handler.
[functions.business-password-recovery]
verify_jwt = false

[functions.public-support-ticket]
verify_jwt = false

# This protected handler validates the bearer with Auth and checks the current
# platform role in the user-scoped database operation before touching Auth.
[functions.platform-tenant-account]
verify_jwt = false

# Public, limited operational observations. Optional user JWTs are verified in Auth.
[functions.platform-observation]
verify_jwt = false
